spring.application.name=google-drive-manager-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/google_drive_manager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=Z29vZ2xlLWRyaXZlLW1hbmFnZXItc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctcHVycG9zZS1sb25nLWVub3VnaA==
app.jwt.expiration-ms=3600000

# Google Drive Service Account
app.google-drive.credentials-path=classpath:google-drive-service-account.json
app.google-drive.application-name=Google Drive Manager

# Server
server.port=8080
